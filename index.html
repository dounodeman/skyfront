<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyfront</title>
    <style>* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1520; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e8f0ff; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud-dom { position: absolute; inset: 0; pointer-events: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }

/* ---------- shared panel look ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, rgba(30,55,90,0.82), rgba(8,14,24,0.94)); backdrop-filter: blur(3px); }
.screen.clear { background: rgba(6,10,18,0.55); }
.title { font-size: 64px; font-weight: 900; letter-spacing: 10px; color: #f3f6fb; text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
.subtitle { font-size: 15px; letter-spacing: 4px; color: #9fb7d4; margin-top: 6px; margin-bottom: 30px; text-transform: uppercase; }
.panel { background: rgba(16,26,42,0.88); border: 1px solid rgba(140,175,220,0.22); border-radius: 12px; padding: 22px 26px; box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
.row { display: flex; gap: 18px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
h2 { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #9fc3ee; margin-bottom: 12px; font-weight: 700; }
button, .btn { background: linear-gradient(#2a4568, #1d324f); color: #eaf2ff; border: 1px solid rgba(150,190,240,0.35); border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all .12s; font-family: inherit; }
button:hover { background: linear-gradient(#36598a, #24406a); border-color: rgba(170,210,255,0.7); }
button.primary { background: linear-gradient(#d9842c, #b5641a); border-color: rgba(255,200,140,0.6); font-size: 18px; padding: 13px 30px; }
button.primary:hover { background: linear-gradient(#eb9a3e, #c87424); }
button.small { padding: 6px 10px; font-size: 12px; }
button:disabled { opacity: 0.4; cursor: default; }
.seg { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(150,190,240,0.3); }
.seg button { border-radius: 0; border: none; border-right: 1px solid rgba(150,190,240,0.2); padding: 8px 14px; font-size: 13px; background: #18283f; }
.seg button:last-child { border-right: none; }
.seg button.on { background: linear-gradient(#3a6fae, #2b5a92); }
label.opt { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 14px; color: #cddcf0; padding: 4px 0; }
input[type=range] { width: 160px; accent-color: #d9842c; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: #d9842c; }

/* ---------- plane cards ---------- */
.planes { display: grid; grid-template-columns: repeat(3, 210px); gap: 12px; }
.plane { background: rgba(22,36,58,0.9); border: 2px solid rgba(140,175,220,0.18); border-radius: 10px; padding: 12px; cursor: pointer; transition: all .12s; position: relative; }
.plane:hover { border-color: rgba(170,210,255,0.55); }
.plane.sel { border-color: #e59a45; background: rgba(48,40,30,0.92); }
.plane.locked { opacity: 0.5; cursor: not-allowed; }
.plane .name { font-weight: 800; font-size: 16px; }
.plane .era { font-size: 11px; color: #9fb7d4; letter-spacing: 2px; text-transform: uppercase; }
.plane .lock { position: absolute; top: 10px; right: 10px; font-size: 11px; color: #ffcc88; }
.bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 3px; }
.bar > div { height: 100%; background: linear-gradient(90deg, #4a8fe0, #8ec4ff); border-radius: 3px; }
.stat { font-size: 11px; color: #a9bdd6; margin-top: 6px; display: flex; flex-direction: column; }
.desc { font-size: 13px; color: #b9cbe2; line-height: 1.45; max-width: 330px; }

/* ---------- controls list ---------- */
.binds { max-height: 58vh; overflow-y: auto; padding-right: 8px; min-width: 470px; }
.bind { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
.bind .keys { display: flex; gap: 6px; }
.key { background: #22364f; border: 1px solid rgba(150,190,240,0.35); border-radius: 5px; padding: 3px 9px; font-size: 12px; font-weight: 700; cursor: pointer; min-width: 40px; text-align: center; }
.key.wait { background: #a8621c; }

/* ---------- misc ---------- */
.loading { font-size: 18px; letter-spacing: 2px; color: #b8cde8; }
.progress { width: 360px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 16px; overflow: hidden; }
.progress > div { height: 100%; background: #d9842c; width: 0; transition: width .2s; }
.hint { font-size: 13px; color: #8fa7c4; margin-top: 14px; }
.score { font-size: 14px; color: #ffd28a; }
table.res { border-collapse: collapse; font-size: 14px; min-width: 360px; }
table.res td { padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
table.res td:last-child { text-align: right; color: #ffd28a; font-weight: 700; }
.big { font-size: 46px; font-weight: 900; letter-spacing: 6px; }
.win { color: #7fd47f; } .lose { color: #ff6a5a; }
.click-to-fly { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.55); padding: 12px 22px; border-radius: 8px; font-size: 16px; font-weight: 700; letter-spacing: 1px; pointer-events: none; }
</style>
